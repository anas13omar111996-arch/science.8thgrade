<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار العلوم التفاعلي - الدرس الثاني: الكثافة والطفو (15 سؤالاً)</title>
  <style>
    :root {
      --primary-blue: #1d4ed8;
      --light-blue: #0284c7;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --success-bg: #dcfce7;
      --success-border: #22c55e;
      --success-text: #15803d;
      --error-bg: #fee2e2;
      --error-border: #ef4444;
      --error-text: #b91c1c;
      --timer-bg: #fff7ed;
      --timer-border: #fed7aa;
      --timer-text: #c2410c;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .quiz-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 720px;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }

    /* Header Styling */
    .header-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .quiz-title {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--primary-blue);
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .quiz-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .teacher-badge {
      display: inline-block;
      background-color: #e0e7ff;
      color: #3730a3;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 5px 18px;
      border-radius: 20px;
    }

    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 20px 0 25px 0;
    }

    /* Timer & Progress Bar Row */
    .top-status-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .timer-badge {
      background-color: var(--timer-bg);
      border: 1px solid var(--timer-border);
      color: var(--timer-text);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      min-width: 100px;
      justify-content: center;
    }

    .progress-container {
      flex-grow: 1;
      height: 12px;
      background-color: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--light-blue);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* Question & Options */
    .question-meta {
      color: var(--light-blue);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 22px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: right;
      padding: 14px 20px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background-color: #ffffff;
      font-size: 1rem;
      color: #334155;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .option-btn:hover:not([disabled]) {
      border-color: var(--light-blue);
      background-color: #f0f9ff;
    }

    .option-btn.correct {
      background-color: var(--success-bg) !important;
      border-color: var(--success-border) !important;
      color: var(--success-text) !important;
      font-weight: 700;
    }

    .option-btn.incorrect {
      background-color: var(--error-bg) !important;
      border-color: var(--error-border) !important;
      color: var(--error-text) !important;
    }

    /* Feedback & Controls */
    .feedback-box {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.visible { display: block; }
    .feedback-box.correct-fb { background-color: var(--success-bg); color: var(--success-text); border: 1px solid #a7f3d0; }
    .feedback-box.incorrect-fb { background-color: var(--error-bg); color: var(--error-text); border: 1px solid #fecaca; }

    .controls-row {
      margin-top: 25px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      padding: 12px 30px;
      background-color: var(--primary-blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      transition: opacity 0.2s;
    }

    .next-btn:hover { opacity: 0.9; }

    /* Results Screen */
    .results-screen {
      text-align: center;
      display: none;
      padding: 20px 0;
    }

    .score-display {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary-blue);
      margin: 15px 0;
    }
  </style>
</head>
<body>

<div class="quiz-card">
  <!-- Header -->
  <div class="header-section">
    <h1 class="quiz-title">اختبار العلوم التفاعلي ⚖️</h1>
    <div class="quiz-subtitle">الدرس الثاني: الكثافة والطفو (الصف الثامن)</div>
    <div class="teacher-badge">إعداد: الأستاذ أنس المزرعاوي</div>
  </div>

  <hr class="divider">

  <!-- Quiz Screen -->
  <div id="quiz-screen">
    <div class="top-status-bar">
      <div class="timer-badge">
        ⏱️ <span id="timer-text">30</span> ثانية
      </div>
      <div class="progress-container">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <div id="question-meta" class="question-meta">السؤال 1 من 15</div>
    <div id="question-text" class="question-text"></div>
    <div id="options-container" class="options-list"></div>
    <div id="feedback-box" class="feedback-box"></div>

    <div class="controls-row">
      <button id="next-btn" class="next-btn" onclick="nextQuestion()">السؤال التالي</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="results-screen">
    <h2>أحسنت! انتهى الاختبار</h2>
    <p>نتيجتك النهائية هي:</p>
    <div id="final-score" class="score-display">0 / 15</div>
    <button class="next-btn" style="display:inline-block;" onclick="restartQuiz()">إعادة الاختبار</button>
  </div>
</div>

<script>
  // أسئلة الدرس الثاني: الكثافة والطفو (الصف الثامن - 15 سؤالاً مستمدة من الكتاب المرفق)
  const questions = [
    {
      question: "تُعرّف الكثافة (Density) بأنها:",
      options: ["مقدار الحجم لكل وحدة كتلة", "مقدار الكتلة لكل وحدة حجم من المادة", "مقدار القوة المؤثرة في السطح", "وزن السائل المزاح"],
      correct: 1,
      explanation: "إجابة صحيحة! تُعبر الكثافة عن مقدار الكتلة (m) لكل وحدة حجم (V) من المادة، وتُحسب بالعلاقة D = m/V[cite: 62]."
    },
    {
      question: "تُقاس الكثافة في النظام الدولي للوحدات (SI) بوحدة:",
      options: ["g/cm³", "kg/m³", "N/m²", "kg/L"],
      correct: 1,
      explanation: "إجابة صحيحة! تُقاس الكثافة في النظام الدولي للوحدات بوحدة kg/m³ ويمكن التعبير عنها بوحدات أخرى مثل g/cm³[cite: 62]."
    },
    {
      question: "الأجسام التي تكون كثافتها أكبر من كثافة السائل الموضوعة فيه فإنها:",
      options: ["تطفو على سطحه", "تنغمر فيه وتستقر في القاع", "تبقى معلقة في منتصف السائل تماماً", "تتحرك للأعلى بفعل قوة الطفو الأكبر"],
      correct: 1,
      explanation: "إجابة صحيحة! الأجسام التي تكون كثافاتها أكبر من كثافة السائل تنغمر فيه وتهبط إلى الأسفل لتستقر في القاع[cite: 63, 67]."
    },
    {
      question: "الأداة المستخدمة عملياً لقياس كثافة السوائل تُسمى:",
      options: ["الميزان الإلكتروني", "المخبار المدرج", "الهيدروميتر", "المطياف الذري"],
      correct: 2,
      explanation: "إجابة صحيحة! تُقاس كثافة السوائل عملياً باستخدام أداة تُسمى الهيدروميتر[cite: 63]."
    },
    {
      question: "عندما ينسكب الزيت من السفن في البحر، يطفو على سطح الماء لأن كثافة الزيت:",
      options: ["أكبر من كثافة الماء", "تساوي كثافة الماء تماماً", "أقل من كثافة الماء", "تعتمد على شكل بقعة الزيت"],
      correct: 2,
      explanation: "إجابة صحيحة! يطفو الزيت على سطح الماء لأن كثافته أقل من كثافة الماء[cite: 63, 64]."
    },
    {
      question: "القوة الرأسية إلى الأعلى التي تؤثر بها الموائع في الأجسام المغمورة فيها كلياً أو جزئياً تُسمى:",
      options: ["قوة الجاذبية", "قوة الطفو (Buoyant Force)", "الضغط الجوي", "القوة العمودية"],
      correct: 1,
      explanation: "إجابة صحيحة! تؤثر الموائع في الأجسام المغمورة فيها كلياً أو جزئياً بقوة دفع إلى الأعلى تُسمى قوة الطفو[cite: 62, 66]."
    },
    {
      question: "تنص قاعدة أرخميدس على أن الأجسام المغمورة كلياً أو جزئياً في مائع تتأثر بقوة طفو تساوي:",
      options: ["وزن الجسم الحقيقي", "وزن المائع المزاح", "حجم الجسم كلياً", "الضغط الكلي للمائع"],
      correct: 1,
      explanation: "إجابة صحيحة! تنص قاعدة أرخميدس على أن الأجسام المغمورة كلياً أو جزئياً في مائع تتأثر بقوة طفو تساوي وزن المائع المزاح[cite: 66]."
    },
    {
      question: "حجم السائل المزاح لجسم مغمور كلياً في سائل يساوي:",
      options: ["حجم الجزء المغمور فقط", "حجم الجسم كلياً", "صفر", "كتلة الجسم مقسومة على كثافته"],
      correct: 1,
      explanation: "إجابة صحيحة! حجم السائل المزاح لجسم مغمور كلياً يساوي حجم الجسم تماماً[cite: 66]."
    },
    {
      question: "عندما يترك جسم حرّ في سائل وكانت كثافته مساوية لكثافة السائل، فإن الجسم:",
      options: ["يهبط ليستقر في القاع", "يتحرك للأعلى ويطفو على السطح", "يبقى معلقاً في السائل وتكون قوة الطفو مساوية لوزنه", "ينغمر جزئياً بربع حجمه"],
      correct: 2,
      explanation: "إجابة صحيحة! الجسم الذي تساوي كثافته كثافة السائل يبقى معلقاً عند تركه حراً، وتكون قوة الطفو المؤثرة فيه مساوية لوزنه[cite: 67]."
    },
    {
      question: "السفينة التي تطفو على سطح الماء تكون متزنة؛ لأن وزن الماء الذي تزيحه السفينة:",
      options: ["أقل من وزن السفينة", "يساوي وزن السفينة", "أكبر بكثير من وزن السفينة", "يساوي الصفر"],
      correct: 1,
      explanation: "إجابة صحيحة! لأن قوة الطفو تساوي وزن السائل المزاح، ولأن السفينة متزنة (قوة الطفو تساوي وزنها)، فإن وزن الماء الذي تزيحه السفينة يساوي وزنها[cite: 68]."
    },
    {
      question: "تُملأ بالونات الطقس بغاز الهيليوم لأن كثافة الهيليوم:",
      options: ["أكبر من كثافة الهواء", "تساوي كثافة الهواء تماماً", "أقل من كثافة الهواء", "تساوي صفر كلياً"],
      correct: 2,
      explanation: "إجابة صحيحة! يُملأ بالون الطقس بغاز الهيليوم وهو غاز كثافته أقل من كثافة الهواء، فيتأثر بقوة طفو للأكبر ترتفعه لطبقات الجو العليا[cite: 68]."
    },
    {
      question: "إذا كانت كتلة قطعة خشب 50g وحجمها 80cm³، فإن كثافتها تساوي:",
      options: ["0.375 g/cm³", "0.625 g/cm³", "1.25 g/cm³", "8.0 g/cm³"],
      correct: 1,
      explanation: "إجابة صحيحة! الكثافة = الكتلة ÷ الحجم = 50 ÷ 80 = 5/8 = 0.625 g/cm³."
    },
    {
      question: "كلما زادت كثافة الجسم بالنسبة للسائل الذي يطفو عليه، فإن حجم الجزء المغمور من الجسم في السائل:",
      options: ["يقل", "يزاد", "يبقى ثابتاً ولا يتأثر", "ينعدم تماماً"],
      correct: 1,
      explanation: "إجابة صحيحة! كلما زادت كثافة الجسم زاد حجم الجزء المغمور منه في السائل."
    },
    {
      question: "عند وضع بيضة في كأس ماء عذب ثم نقلها إلى كأس ماء مالح، فإن البيضة تطفو في الماء المالح لأن:",
      options: ["كثافة الماء المالح أقل من الماء العذب", "كثافة الماء المالح أكبر من كثافة الماء العذب", "وزن البيضة يزداد في الماء المالح", "حجم البيضة يتغير في الملوحة"],
      correct: 1,
      explanation: "إجابة صحيحة! كثافة الماء المالح أكبر من كثافة الماء العذب، مما يوفر قوة طفو أكبر تجعل البيضة تطفو[cite: 67]."
    },
    {
      question: "أي العلاقات الآتية تُستخدم لحساب كثافة جسم صلب منتظم الشكل (D):",
      options: ["D = m × V", "D = V / m", "D = m / V", "D = F / A"],
      correct: 2,
      explanation: "إجابة صحيحة! تُحسب الكثافة بقسمة الكتلة على الحجم (D = m / V)[cite: 62]."
    }
  ];

  let currentQuestion = 0;
  let score = 0;
  let timerInterval;
  const QUESTION_TIME = 30;
  let timeLeft = QUESTION_TIME;

  function startTimer() {
    timeLeft = QUESTION_TIME;
    document.getElementById("timer-text").innerText = timeLeft;
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById("timer-text").innerText = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, 1000);
  }

  function handleTimeout() {
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".option-btn");
    const feedback = document.getElementById("feedback-box");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correct) {
        btn.classList.add("correct");
      }
    });

    feedback.innerText = `⏰ انتهى الوقت! ${q.explanation}`;
    feedback.className = "feedback-box visible incorrect-fb";
    document.getElementById("next-btn").style.display = "inline-block";
  }

  function loadQuestion() {
    const q = questions[currentQuestion];
    
    document.getElementById("question-meta").innerText = `السؤال ${currentQuestion + 1} من ${questions.length}`;
    const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
    document.getElementById("progress-fill").style.width = `${progressPercent}%`;

    document.getElementById("question-text").innerText = q.question;
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    const feedback = document.getElementById("feedback-box");
    feedback.className = "feedback-box";
    feedback.innerText = "";
    document.getElementById("next-btn").style.display = "none";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      optionsContainer.appendChild(btn);
    });

    startTimer();
  }

  function selectOption(selectedIdx) {
    clearInterval(timerInterval);
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".option-btn");
    const feedback = document.getElementById("feedback-box");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correct) {
        btn.classList.add("correct");
      }
      if (idx === selectedIdx && idx !== q.correct) {
        btn.classList.add("incorrect");
      }
    });

    if (selectedIdx === q.correct) {
      score++;
      feedback.innerText = q.explanation;
      feedback.className = "feedback-box visible correct-fb";
    } else {
      feedback.innerText = `إجابة خاطئة. ${q.explanation}`;
      feedback.className = "feedback-box visible incorrect-fb";
    }

    document.getElementById("next-btn").style.display = "inline-block";
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    clearInterval(timerInterval);
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = `${score} / ${questions.length}`;
  }

  function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("result-screen").style.display = "none";
    loadQuestion();
  }

  loadQuestion();
</script>

</body>
</html>
