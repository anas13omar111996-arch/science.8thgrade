<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار العلوم التفاعلي - الدرس الثالث: استدامة الموارد الطبيعية (15 سؤالاً)</title>
  <style>
    :root {
      --primary-blue: #1d4ed8;
      --light-blue: #0284c7;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --success-bg: #dcfce7;
      --success-border: #22c55e;
      --success-text: #15803d;
      --error-bg: #fee2e2;
      --error-border: #ef4444;
      --error-text: #b91c1c;
      --timer-bg: #fff7ed;
      --timer-border: #fed7aa;
      --timer-text: #c2410c;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .quiz-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 720px;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }

    /* Header Styling */
    .header-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .quiz-title {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--primary-blue);
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .quiz-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .teacher-badge {
      display: inline-block;
      background-color: #e0e7ff;
      color: #3730a3;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 5px 18px;
      border-radius: 20px;
    }

    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 20px 0 25px 0;
    }

    /* Timer & Progress Bar Row */
    .top-status-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .timer-badge {
      background-color: var(--timer-bg);
      border: 1px solid var(--timer-border);
      color: var(--timer-text);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      min-width: 100px;
      justify-content: center;
    }

    .progress-container {
      flex-grow: 1;
      height: 12px;
      background-color: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--light-blue);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* Question & Options */
    .question-meta {
      color: var(--light-blue);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 22px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: right;
      padding: 14px 20px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background-color: #ffffff;
      font-size: 1rem;
      color: #334155;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .option-btn:hover:not([disabled]) {
      border-color: var(--light-blue);
      background-color: #f0f9ff;
    }

    .option-btn.correct {
      background-color: var(--success-bg) !important;
      border-color: var(--success-border) !important;
      color: var(--success-text) !important;
      font-weight: 700;
    }

    .option-btn.incorrect {
      background-color: var(--error-bg) !important;
      border-color: var(--error-border) !important;
      color: var(--error-text) !important;
    }

    /* Feedback & Controls */
    .feedback-box {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.visible { display: block; }
    .feedback-box.correct-fb { background-color: var(--success-bg); color: var(--success-text); border: 1px solid #a7f3d0; }
    .feedback-box.incorrect-fb { background-color: var(--error-bg); color: var(--error-text); border: 1px solid #fecaca; }

    .controls-row {
      margin-top: 25px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      padding: 12px 30px;
      background-color: var(--primary-blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      transition: opacity 0.2s;
    }

    .next-btn:hover { opacity: 0.9; }

    /* Results Screen */
    .results-screen {
      text-align: center;
      display: none;
      padding: 20px 0;
    }

    .score-display {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary-blue);
      margin: 15px 0;
    }
  </style>
</head>
<body>

<div class="quiz-card">
  <!-- Header -->
  <div class="header-section">
    <h1 class="quiz-title">اختبار العلوم التفاعلي 🌱</h1>
    <div class="quiz-subtitle">الدرس الثالث: استدامة الموارد الطبيعية (الصف الثامن)</div>
    <div class="teacher-badge">إعداد: أ. أنس المزرعاوي</div>
  </div>

  <hr class="divider">

  <!-- Quiz Screen -->
  <div id="quiz-screen">
    <div class="top-status-bar">
      <div class="timer-badge">
        ⏱️ <span id="timer-text">30</span> ثانية
      </div>
      <div class="progress-container">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <div id="question-meta" class="question-meta">السؤال 1 من 15</div>
    <div id="question-text" class="question-text"></div>
    <div id="options-container" class="options-list"></div>
    <div id="feedback-box" class="feedback-box"></div>

    <div class="controls-row">
      <button id="next-btn" class="next-btn" onclick="nextQuestion()">السؤال التالي</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="results-screen">
    <h2>أحسنت! انتهى الاختبار</h2>
    <p>نتيجتك النهائية هي:</p>
    <div id="final-score" class="score-display">0 / 15</div>
    <button class="next-btn" style="display:inline-block;" onclick="restartQuiz()">إعادة الاختبار</button>
  </div>
</div>

<script>
  // أسئلة درس استدامة الموارد الطبيعية (الصف الثامن - 15 سؤالاً مستمدة حصرياً من الملف المرفق)
  const questions = [
    {
      question: "ظاهرة تحدث نتيجة دخول الفسفور والنيتروجين الموجودين في الأسمدة إلى المياه لتنمو الطحالب نمواً كبيراً وتحجب الضوء فتهلك النباتات والكائنات البحرية تُعرف بـ:",
      options: ["التغير المناخي", "الإثراء الغذائي", "التصحر", "الهطل الحمضي"],
      correct: 1,
      explanation: "إجابة صحيحة! الإثراء الغذائي يحدث بطريقة غير مباشرة بسبب وصول الأسمدة الغنية بالفسفور والنيتروجين إلى المياه وتكاثر الطحالب."
    },
    {
      question: "الهطل الحمضي من الملوثات الثانوية للهواء، ويتكون نتيجة تفاعل غاز ثاني أكسيد الكبريت وغاز ثاني أكسيد النيتروجين مع:",
      options: ["أكسجين الجو الصافي", "الماء في الغلاف الجوي", "غازات الدفيئة المركبة", "أكاسيد الكربون المباشرة"],
      correct: 1,
      explanation: "إجابة صحيحة! يتكون الهطل الحمضي نتيجة تفاعل ثاني أكسيد الكبريت وثاني أكسيد النيتروجين مع الماء في الغلاف الجوي."
    },
    {
      question: "الاستغلال الجائر للموارد الطبيعية من دون تعويض النقص الحاصل فيها مع مرور الزمن يُعرف بـ:",
      options: ["استدامة الموارد الطبيعية", "استنزاف الموارد الطبيعية (Depletion of Natural Resources)", "الإثراء الغذائي", "التنوع الحيوي"],
      correct: 1,
      explanation: "إجابة صحيحة! استنزاف الموارد هو الاستغلال الجائر لها دون تعويض النقص مع مرور الزمن."
    },
    {
      question: "يُقصد باستدامة الموارد الطبيعية (Sustainability of Natural Resources) الآتي:",
      options: ["استهلاك الموارد بأقصى سرعة ممكنة", "استخدام الموارد الطبيعية بما يلبي الاحتياجات دون الإضرار بالبيئة والمحافظة عليها للأجيال القادمة", "الاعتماد كلياً على الوقود الأحفوري", "إزالة الغابات للتوسع العمراني"],
      correct: 1,
      explanation: "إجابة صحيحة! الاستدامة تعني تلبية الاحتياجات دون الإضرار بالبيئة وحفظ الموارد للأجيال القادمة."
    },
    {
      question: "من طرائق استدامة الموارد الطبيعية والتقليل من استهلاك الوقود الأحفوري والحد من تلوث البيئة:",
      options: ["إزالة الغابات لزيادة المساحات الزراعية", "استخدام موارد الطاقة المتجددة (مثل الطاقة الشمسية والرياح)", "التوسع في حرق الفحم الحجري", "التعدين الجائر للمعدن"],
      correct: 1,
      explanation: "إجابة صحيحة! استخدام موارد الطاقة المتجددة الصديقة للبيئة يسهم بشكل مباشر في استدامة الموارد والتقليل من تلوث البيئة."
    },
    {
      question: "الطاقة المستمدة من الماغما في باطن الأرض تُسمى طاقة:",
      options: ["الكهرومائية", "الجيوحرارية", "الشمسية الضوئية", "الرياح الحركية"],
      correct: 1,
      explanation: "إجابة صحيحة! الطاقة الجيوحرارية هي الطاقة المستمدة من الماغما في باطن الأرض وتُعد مصدراً متجدداً."
    },
    {
      question: "أُنشئت محمية غابات عجلون ومحمية الأزرق المائية في الأردن بهدف أساسي هو:",
      options: ["استخراج النحاس والحديد", "المحافظة على الكائنات الحية والتنوع الحيوي", "توليد الطاقة الكهربائية بالرياح", "التوسع في إقامة الطرق والسدود"],
      correct: 1,
      explanation: "إجابة صحيحة! أُنشئت المحميات الطبيعية في الأردن للمحافظة على الكائنات الحية المهددة بالانقراض والتنوع الحيوي."
    },
    {
      question: "أي من الكائنات الحية الآتية يُعد سمكاً مهدداً بالانقراض وتُعد محمية الأزرق المائية موطناً له؟",
      options: ["الثعلب الأحمر", "السسوسنة السوداء", "سمك السرحاني", "أشجار الخروب والبطم"],
      correct: 2,
      explanation: "إجابة صحيحة! تحتوي محمية الأزرق المائية على سمك السرحاني المهدد بالانقراض."
    },
    {
      question: "وُقعت اتفاقية الأمم المتحدة بشأن تغير المناخ (Climate Change Agreement) لأول مرة في عام 1992م خلال مؤتمر سُمي:",
      options: ["قمة الأرض في البرازيل", "قمة المناخ في الأردن", "مؤتمر الطفيلة للطاقة", "اتفاقية مكافحة التصحر الدولية"],
      correct: 0,
      explanation: "إجابة صحيحة! وُقعت اتفاقية التغير المناخي عام 1992م أثناء انعقاد مؤتمر سُمي 'قمة الأرض' في البرازيل."
    },
    {
      question: "الهدف الرئيس لاتفاقية التنوع الحيوي التي وُقعت في عام 1992م هو:",
      options: ["زيادة انبعاثات غازات الدفيئة", "الحفاظ على التنوع الحيوي والاستخدام المستدام لمكوناته وتقاسم المنافع الناتجة عن الموارد الجينية", "التخلص من جميع الغابات في العالم", "مكافحة الجفاف الزراعي فقط"],
      correct: 1,
      explanation: "إجابة صحيحة! تهدف اتفاقية التنوع الحيوي إلى الحفاظ على التنوع الحيوي والاستخدام المستدام لمكوناته."
    },
    {
      question: "وُقعت اتفاقية مكافحة التصحر في عام 1994م بهدف:",
      options: ["استعادة الأراضي المتدهورة وتحسين إنتاجيتها وتقليل آثار الجفاف", "تشجيع قطع الأشجار والرعي الجائر", "بناء السدود في المناطق الجافة", "زيادة التمدد العمراني على الأراضي الزراعية"],
      correct: 0,
      explanation: "إجابة صحيحة! تهدف اتفاقية مكافحة التصحر إلى استعادة الأراضي المتدهورة وتحسين إنتاجيتها وتقليل آثار الجفاف."
    },
    {
      question: "من الكائنات الحية الحساسة التي تستخدم كمؤشر حيوي؛ إذ تموت فوراً إذا تلوث هواء المكان بتواجدها ونموها على الصخور:",
      options: ["روبيان المياه العذبة", "الأشنات", "سمك السرحاني", "الثعلب الأحمر"],
      correct: 1,
      explanation: "إجابة صحيحة! تظهر الأشنات وتنمو على الصخور لكنها تموت إذا تلوث هواء المكان، فتستخدم كمؤشر حيوي للتلوث."
    },
    {
      question: "وجود كائنات مثل 'روبيان المياه العذبة' في مسطح مائي يدل على أن المياه:",
      options: ["ملوثة بالمواد الكيميائية السامة", "غير ملوثة ونظيفة", "مالحة بنسبة عالية جداً", "تحتوي على نسبة عالية من مياه الصرف الصحي"],
      correct: 1,
      explanation: "إجابة صحيحة! يعيش روبيان المياه العذبة فقط في المياه النظيفة، فوجوده يدل على أن المياه غير ملوثة."
    },
    {
      question: "من الإستراتيجيات الرشيدة المتبعة لضمان استدامة الموارد المعدنية (مثل الحديد والنحاس):",
      options: ["زيادة استنزافها دون قيود", "تعزيز إعادة التدوير واستخلاص المواد الأولية واستخدام بدائل صناعية كالْبلاستيك", "التوقف نهائياً عن استخدام الأجهزة الإلكترونية", "حرق كافة البطاريات المستعملة"],
      correct: 1,
      explanation: "إجابة صحيحة! تتضمن استدامة الموارد المعدنية تعزيز إعادة التدوير والبحث عن بدائل صناعية مناسبة مثل استخدام البلاستيك للأنابيب."
    },
    {
      question: "أُنشئت مزرعة رياح لتوليد الطاقة الكهربائية نظراً لنشاط الرياح وقوتها في الأردن في منطقة:",
      options: ["عجلون", "الطفيلة", "الأزرق", "العقبة"],
      correct: 1,
      explanation: "إجابة صحيحة! أُنشئت مزرعة رياح لتوليد الطاقة الكهربائية في منطقة الطفيلة."
    }
  ];

  let currentQuestion = 0;
  let score = 0;
  let timerInterval;
  const QUESTION_TIME = 30;
  let timeLeft = QUESTION_TIME;

  function startTimer() {
    timeLeft = QUESTION_TIME;
    document.getElementById("timer-text").innerText = timeLeft;
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById("timer-text").innerText = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, 1000);
  }

  function handleTimeout() {
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".option-btn");
    const feedback = document.getElementById("feedback-box");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correct) {
        btn.classList.add("correct");
      }
    });

    feedback.innerText = `⏰ انتهى الوقت! ${q.explanation}`;
    feedback.className = "feedback-box visible incorrect-fb";
    document.getElementById("next-btn").style.display = "inline-block";
  }

  function loadQuestion() {
    const q = questions[currentQuestion];
    
    document.getElementById("question-meta").innerText = `السؤال ${currentQuestion + 1} من ${questions.length}`;
    const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
    document.getElementById("progress-fill").style.width = `${progressPercent}%`;

    document.getElementById("question-text").innerText = q.question;
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    const feedback = document.getElementById("feedback-box");
    feedback.className = "feedback-box";
    feedback.innerText = "";
    document.getElementById("next-btn").style.display = "none";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      optionsContainer.appendChild(btn);
    });

    startTimer();
  }

  function selectOption(selectedIdx) {
    clearInterval(timerInterval);
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".option-btn");
    const feedback = document.getElementById("feedback-box");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correct) {
        btn.classList.add("correct");
      }
      if (idx === selectedIdx && idx !== q.correct) {
        btn.classList.add("incorrect");
      }
    });

    if (selectedIdx === q.correct) {
      score++;
      feedback.innerText = q.explanation;
      feedback.className = "feedback-box visible correct-fb";
    } else {
      feedback.innerText = `إجابة خاطئة. ${q.explanation}`;
      feedback.className = "feedback-box visible incorrect-fb";
    }

    document.getElementById("next-btn").style.display = "inline-block";
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    clearInterval(timerInterval);
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = `${score} / ${questions.length}`;
  }

  function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("result-screen").style.display = "none";
    loadQuestion();
  }

  loadQuestion();
</script>

</body>
</html>
