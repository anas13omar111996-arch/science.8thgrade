<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار العلوم التفاعلي - الصف الثامن</title>
  <style>
    :root {
      --primary: #2b5c8f;
      --success: #2e7d32;
      --error: #c62828;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .quiz-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .quiz-header {
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .badge-visual { background: #e3f2fd; color: #1565c0; }
    .badge-logical { background: #f3e5f5; color: #7b1fa2; }
    .badge-practical { background: #e8f5e9; color: #2e7d32; }

    .question {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 12px 20px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 1rem;
      text-align: right;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not([disabled]) {
      background: #eef5fc;
      border-color: var(--primary);
    }

    .option-btn.correct {
      background-color: #d4edda !important;
      border-color: var(--success) !important;
      color: var(--success);
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #f8d7da !important;
      border-color: var(--error) !important;
      color: var(--error);
    }

    .feedback {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      display: none;
    }

    .feedback.visible { display: block; }
    .feedback.correct-fb { background-color: #e8f5e9; color: var(--success); }
    .feedback.incorrect-fb { background-color: #ffebee; color: var(--error); }

    .controls {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .next-btn {
      padding: 10px 25px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }

    .next-btn:hover { opacity: 0.9; }

    .result-container {
      text-align: center;
      display: none;
    }

    .score {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      margin: 15px 0;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div id="quiz-screen">
    <div class="quiz-header">
      <span id="style-badge" class="badge"></span>
      <div id="progress">السؤال 1 من 2</div>
    </div>
    
    <div id="question-text" class="question"></div>
    <div id="options-container" class="options"></div>
    <div id="feedback" class="feedback"></div>

    <div class="controls">
      <button id="next-btn" class="next-btn" onclick="nextQuestion()">السؤال التالي</button>
    </div>
  </div>

  <div id="result-screen" class="result-container">
    <h2>انتهى الاختبار!</h2>
    <p>درجتك النهائية هي:</p>
    <div id="final-score" class="score"></div>
    <button class="next-btn" style="display:inline-block;" onclick="restartQuiz()">إعادة الاختبار</button>
  </div>
</div>

<script>
  // نموذج البيانات: سنقوم باستبداله بأسئلة درسك لاحقاً
  const questions = [
    {
      question: "تسمى العملية التي تحول بها النباتات الطاقة الضوئية إلى طاقة كيميائية بـ:",
      options: ["التنفس الخلوي", "البناء الضوئي", "الخاصية الاسموزية", "الانتشار"],
      correct: 1,
      style: "بصري / مفاهيمي",
      badgeClass: "badge-visual",
      explanation: "إجابة صحيحة! البناء الضوئي هو العملية الأساسية لإنتاج الغذاء في النباتات باستغلال الضوء."
    },
    {
      question: "الخلية هي الوحيدة التي تحتوي على جدار خلوي حقيقي. (صواب / خطأ)",
      options: ["صواب", "خطأ"],
      correct: 1,
      style: "تحليلي / عملي",
      badgeClass: "badge-logical",
      explanation: "إجابة صحيحة! الجدار الخلوي يوجد في الخلايا النباتية والفطريات وبعض البكتيريا وليس حكراً على نوع واحد."
    }
  ];

  let currentQuestion = 0;
  let score = 0;

  function loadQuestion() {
    const q = questions[currentQuestion];
    document.getElementById("style-badge").className = `badge ${q.badgeClass}`;
    document.getElementById("style-badge").innerText = `نمط التعلم: ${q.style}`;
    document.getElementById("progress").innerText = `السؤال ${currentQuestion + 1} من ${questions.length}`;
    document.getElementById("question-text").innerText = q.question;
    
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    const feedback = document.getElementById("feedback");
    feedback.className = "feedback";
    feedback.innerText = "";
    document.getElementById("next-btn").style.display = "none";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(selectedIdx) {
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".option-btn");
    const feedback = document.getElementById("feedback");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correct) {
        btn.classList.add("correct");
      }
      if (idx === selectedIdx && idx !== q.correct) {
        btn.classList.add("incorrect");
      }
    });

    if (selectedIdx === q.correct) {
      score++;
      feedback.innerText = q.explanation;
      feedback.classList.add("visible", "correct-fb");
    } else {
      feedback.innerText = `إجابة خاطئة. ${q.explanation}`;
      feedback.classList.add("visible", "incorrect-fb");
    }

    document.getElementById("next-btn").style.display = "inline-block";
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = `${score} / ${questions.length}`;
  }

  function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("result-screen").style.display = "none";
    loadQuestion();
  }

  // تشغيل السؤال الأول عند التحميل
  loadQuestion();
</script>

</body>
</html>
