<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار العلوم التفاعلي - الدرس الأول: المادة الوراثية</title>
  <style>
    :root {
      --primary: #2b5c8f;
      --success: #2e7d32;
      --error: #c62828;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .quiz-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .quiz-header {
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .badge-visual { background: #e3f2fd; color: #1565c0; }
    .badge-logical { background: #f3e5f5; color: #7b1fa2; }
    .badge-practical { background: #e8f5e9; color: #2e7d32; }

    .question {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      padding: 14px 20px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 1rem;
      text-align: right;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not([disabled]) {
      background: #eef5fc;
      border-color: var(--primary);
    }

    .option-btn.correct {
      background-color: #d4edda !important;
      border-color: var(--success) !important;
      color: var(--success);
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #f8d7da !important;
      border-color: var(--error) !important;
      color: var(--error);
    }

    .feedback {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }

    .feedback.visible { display: block; }
    .feedback.correct-fb { background-color: #e8f5e9; color: var(--success); border: 1px solid #a5d6a7; }
    .feedback.incorrect-fb { background-color: #ffebee; color: var(--error); border: 1px solid #ef9a9a; }

    .controls {
      margin-top: 25px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      padding: 12px 28px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }

    .next-btn:hover { opacity: 0.9; }

    .result-container {
      text-align: center;
      display: none;
    }

    .score {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--primary);
      margin: 20px 0;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div id="quiz-screen">
    <div class="quiz-header">
      <span id="style-badge" class="badge"></span>
      <div id="progress" style="font-weight: bold; color: #666;"></div>
    </div>
    
    <div id="question-text" class="question"></div>
    <div id="options-container" class="options"></div>
    <div id="feedback" class="feedback"></div>

    <div class="controls">
      <button id="next-btn" class="next-btn" onclick="nextQuestion()">السؤال التالي</button>
    </div>
  </div>

  <div id="result-screen" class="result-container">
    <h2>انتهى اختبار الدرس الأول!</h2>
    <p>درجتك النهائية هي:</p>
    <div id="final-score" class="score"></div>
    <button class="next-btn" style="display:inline-block;" onclick="restartQuiz()">إعادة الاختبار</button>
  </div>
</div>

<script>
  // أسئلة الدرس الأول: المادة الوراثية (الصف الثامن)
  const questions = [
    {
      question: "توجد المادة الوراثية في خلايا الكائنات الحية حقيقية النواة على شكل تراكيب دقيقة تُسمى:",
      options: ["الكروموسومات", "النيوكليوتيدات", "الجاميتات", "الانزيمات"],
      correct: 0,
      style: "نمط بصري / مستوى أساسي",
      badgeClass: "badge-visual",
      explanation: "إجابة صحيحة! تتواجد المادة الوراثية داخل النواة في الخلايا حقيقية النواة على شكل تراكيب دقيقة تُسمى الكروموسومات."
    },
    {
      question: "تتكون وحدة البناء الأساسية للحمض النووي (النيوكليوتيد) من ثلاثة مكونات رئيسة، ليس من بينها:",
      options: ["سكر خماسي منقوص الأكسجين", "مجموعة فوسفات", "قاعدة نيتروجينية", "غلاف بروتيني سميك"],
      correct: 3,
      style: "نمط لفظي / مستوى أساسي",
      badgeClass: "badge-logical",
      explanation: "إجابة صحيحة! النيوكليوتيد يتكون فقط من: سكر خماسي منقوص الأكسجين، مجموعة فوسفات، وقاعدة نيتروجينية واحدة."
    },
    {
      question: "ترتبط القاعدة النيتروجينية الأدينين (A) مع الثايمين (T) برابطتين هيدروجينيتين، بينما ترتبط الغوانين (G) مع السايتوسين (C) بثلاث روابط هيدروجينية. (صواب / خطأ)",
      options: ["صواب", "خطأ"],
      correct: 0,
      style: "نمط تحليلي / مستوى متوسط",
      badgeClass: "badge-logical",
      explanation: "إجابة صحيحة! ترتبط A مع T برابطتين هيدروجينيتين، وترتبط G مع C بثلاث روابط هيدروجينية دائماً في DNA."
    },
    {
      question: "عندما يتعرض الشخص لجرح في الجلد، فإن الخلايا الجسمية تنقسم لتعويض التالف ونمو الجلد عن طريق:",
      options: ["الانقسام المنصف (Meiosis)", "الانقسام المتساوي (Mitosis)", "الانشطار الثنائي (Binary Fission)", "التجدد التلقائي"],
      correct: 1,
      style: "نمط عملي - تطبيقي / مستوى متوسط",
      badgeClass: "badge-practical",
      explanation: "إجابة صحيحة! الانقسام المتساوي يحدث في الخلايا الجسمية بهدف النمو وتعويض الخلايا التالفة لإنتاج خليتين متماثلتين (2n)."
    },
    {
      question: "يتكون الكروموسوم بعد عملية تضاعف الـ DNA من:",
      options: ["كروماتيد واحد وقطعتين مركزيتين", "كروماتيدين شقيقين يربط بينهما قطعة مركزية", "أربع سلاسل DNA غير متماثلة", "كروماتيدات غير شقيقة منفصلة"],
      correct: 1,
      style: "نمط بصري / مستوى متوسط",
      badgeClass: "badge-visual",
      explanation: "إجابة صحيحة! يظهر الكروموسوم بعد التضاعف على شكل كروماتيدين شقيقين يربطان معاً في منطقة القطعة المركزية (Centromere)."
    },
    {
      question: "ينتج عن الانقسام المنصف (Meiosis) أربع خلايا جنسية (جاميتات) تحتوي كل منها على نصف عدد الكروموسومات (1n). (صواب / خطأ)",
      options: ["صواب", "خطأ"],
      correct: 0,
      style: "نمط تحليلي / مستوى متوسط",
      badgeClass: "badge-logical",
      explanation: "إجابة صحيحة! الانقسام المنصف يمر بمرحلتين وينتج 4 خلايا احادية المجموعة الكروموسومية (1n) تُسمى الجاميتات."
    },
    {
      question: "طريقة التكاثر والانقسام الخلوي الشائعة في الكائنات بدائية النواة مثل البكتيريا تُعرف بـ:",
      options: ["الانقسام المتساوي", "الانشطار الثنائي", "الانقسام المنصف", "التضاعف الجيني"],
      correct: 1,
      style: "نمط عملي / مستوى أساسي",
      badgeClass: "badge-practical",
      explanation: "إجابة صحيحة! تنقسم الخلايا بدائية النواة بعد تضاعف مادتها الوراثية بعملية تُسمى الانشطار الثنائي (Binary Fission)."
    },
    {
      question: "مشروع علمي دولي هدف إلى تحديد التسلسل الكامل للنيوكليوتيدات ورسم خرائط الجينات لتتبع الاختلالات الوراثية هو:",
      options: ["مشروع الهندسة الوراثية", "مشروع الجينوم البشري (HGP)", "مشروع التوهج الحيوي", "مشروع أبحاث الخلايا الجذعية"],
      correct: 1,
      style: "نمط تحليلي / مستوى متقدم",
      badgeClass: "badge-logical",
      explanation: "إجابة صحيحة! مشروع الجينوم البشري (Human Genome Project) بدأ عام 1990م وأُعلنت نتائجه عام 2003م لتحديد ترتيب قواعد DNA البشرية."
    }
  ];

  let currentQuestion = 0;
  let score = 0;

  function loadQuestion() {
    const q = questions[currentQuestion];
    document.getElementById("style-badge").className = `badge ${q.badgeClass}`;
    document.getElementById("style-badge").innerText = q.style;
    document.getElementById("progress").innerText = `السؤال ${currentQuestion + 1} من ${questions.length}`;
    document.getElementById("question-text").innerText = q.question;
    
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    const feedback = document.getElementById("feedback");
    feedback.className = "feedback";
    feedback.innerText = "";
    document.getElementById("next-btn").style.display = "none";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(selectedIdx) {
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".option-btn");
    const feedback = document.getElementById("feedback");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correct) {
        btn.classList.add("correct");
      }
      if (idx === selectedIdx && idx !== q.correct) {
        btn.classList.add("incorrect");
      }
    });

    if (selectedIdx === q.correct) {
      score++;
      feedback.innerText = q.explanation;
      feedback.classList.add("visible", "correct-fb");
    } else {
      feedback.innerText = `إجابة خاطئة. ${q.explanation}`;
      feedback.classList.add("visible", "incorrect-fb");
    }

    document.getElementById("next-btn").style.display = "inline-block";
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = `${score} / ${questions.length}`;
  }

  function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("result-screen").style.display = "none";
    loadQuestion();
  }

  loadQuestion();
</script>

</body>
</html>
