<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار العلوم التفاعلي - الدرس الثالث: الوراثة (15 سؤالاً)</title>
  <style>
    :root {
      --primary-blue: #1d4ed8;
      --light-blue: #0284c7;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --success-bg: #dcfce7;
      --success-border: #22c55e;
      --success-text: #15803d;
      --error-bg: #fee2e2;
      --error-border: #ef4444;
      --error-text: #b91c1c;
      --timer-bg: #fff7ed;
      --timer-border: #fed7aa;
      --timer-text: #c2410c;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .quiz-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 720px;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }

    /* Header Styling */
    .header-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .quiz-title {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--primary-blue);
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .quiz-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .teacher-badge {
      display: inline-block;
      background-color: #e0e7ff;
      color: #3730a3;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 5px 18px;
      border-radius: 20px;
    }

    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 20px 0 25px 0;
    }

    /* Timer & Progress Bar Row */
    .top-status-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .timer-badge {
      background-color: var(--timer-bg);
      border: 1px solid var(--timer-border);
      color: var(--timer-text);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      min-width: 100px;
      justify-content: center;
    }

    .progress-container {
      flex-grow: 1;
      height: 12px;
      background-color: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--light-blue);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* Question & Options */
    .question-meta {
      color: var(--light-blue);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 22px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: right;
      padding: 14px 20px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background-color: #ffffff;
      font-size: 1rem;
      color: #334155;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .option-btn:hover:not([disabled]) {
      border-color: var(--light-blue);
      background-color: #f0f9ff;
    }

    .option-btn.correct {
      background-color: var(--success-bg) !important;
      border-color: var(--success-border) !important;
      color: var(--success-text) !important;
      font-weight: 700;
    }

    .option-btn.incorrect {
      background-color: var(--error-bg) !important;
      border-color: var(--error-border) !important;
      color: var(--error-text) !important;
    }

    /* Feedback & Controls */
    .feedback-box {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.visible { display: block; }
    .feedback-box.correct-fb { background-color: var(--success-bg); color: var(--success-text); border: 1px solid #a7f3d0; }
    .feedback-box.incorrect-fb { background-color: var(--error-bg); color: var(--error-text); border: 1px solid #fecaca; }

    .controls-row {
      margin-top: 25px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      padding: 12px 30px;
      background-color: var(--primary-blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      transition: opacity 0.2s;
    }

    .next-btn:hover { opacity: 0.9; }

    /* Results Screen */
    .results-screen {
      text-align: center;
      display: none;
      padding: 20px 0;
    }

    .score-display {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary-blue);
      margin: 15px 0;
    }
  </style>
</head>
<body>

<div class="quiz-card">
  <!-- Header -->
  <div class="header-section">
    <h1 class="quiz-title">اختبار العلوم التفاعلي 🪐</h1>
    <div class="quiz-subtitle">الدرس الثالث: الوراثة وتجارب مندل</div>
    <div class="teacher-badge">إعداد: الأستاذ أنس المزرعاوي</div>
  </div>

  <hr class="divider">

  <!-- Quiz Screen -->
  <div id="quiz-screen">
    <div class="top-status-bar">
      <div class="timer-badge">
        ⏱️ <span id="timer-text">30</span> ثانية
      </div>
      <div class="progress-container">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <div id="question-meta" class="question-meta">السؤال 1 من 15</div>
    <div id="question-text" class="question-text"></div>
    <div id="options-container" class="options-list"></div>
    <div id="feedback-box" class="feedback-box"></div>

    <div class="controls-row">
      <button id="next-btn" class="next-btn" onclick="nextQuestion()">السؤال التالي</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="results-screen">
    <h2>أحسنت! انتهى الاختبار</h2>
    <p>نتيجتك النهائية هي:</p>
    <div id="final-score" class="score-display">0 / 15</div>
    <button class="next-btn" style="display:inline-block;" onclick="restartQuiz()">إعادة الاختبار</button>
  </div>
</div>

<script>
  // أسئلة الدرس الثالث: الوراثة (15 سؤالاً شمولياً)
  const questions = [
    {
      question: "في تجارب مندل، عند تلقيح نبات أصفر القرون مع آخر أخضر القرون (كلاهما نقي السلالة)، ظهرت أفراد الجيل الأول جميعها خضراء القرون. تُسمى صفة لون القرون الخضراء بـ:",
      options: ["الصفة المتنحية", "الصفة السائدة", "الصفة غير المتماثلة", "السيادة المشتركة"],
      correct: 1,
      explanation: "إجابة صحيحة! الصفة السائدة هي الصفة التي تظهر في أفراد الجيل الأول جميعها وتمنع ظهور الصفة المتنحية."
    },
    {
      question: "الصفة التي يُعبر عنها بأليلين متماثلين مثل (TT) أو (tt) تُسمى صفة متماثلة الأليلات (نقية). (صواب / خطأ)",
      options: ["صواب", "خطأ"],
      correct: 0,
      explanation: "إجابة صحيحة! عندما يتطابق الأليلان تكون الصفة متماثلة الأليلات (Homozygous Trait) ونقية."
    },
    {
      question: "المخطط المُستخدم لتوقع الطرز الجينية والشكلية المحتملة للأفراد الناتجة من تزاوج وراثي يُعرف بـ:",
      options: ["مخطط التلقيح الخلطي", "مربع بانيت", "الانقسام المنصف", "السلسلة الوراثية"],
      correct: 1,
      explanation: "إجابة صحيحة! مربع بانيت (Punnett Square) هو المخطط الأداة لتسهيل حل مسائل الوراثة وتوقع الطرز الجينية."
    },
    {
      question: "عند إجراء تلقيح بين نبات بازيلاء أرجواني الأزهار غير متماثل الأليلات (Rr) ونبات أبيض الأزهار (rr)، فإن الطرز الجينية المتوقعة للأبناء هي:",
      options: ["جميعها Rr", "50% Rr : 50% rr", "75% RR : 25% rr", "جميعها rr"],
      correct: 1,
      explanation: "إجابة صحيحة! الأب الأول ينتج جاميتات (R, r) والثاني (r)، فتنتج بنسبة 50% Rr (أرجواني) و 50% rr (أبيض)."
    },
    {
      question: "عند اجتماع أليل الأزهار الحمراء (R) مع أليل الأزهار البيضاء (W) في نبات فم السمكة وتنتج أزهار وردية اللون (صفة وسطية)، فإن نمط الوراثة هو:",
      options: ["السيادة التامة", "السيادة غير التامة", "السيادة المشتركة", "التلقيح الذاتي"],
      correct: 1,
      explanation: "إجابة صحيحة! السيادة غير التامة (Incomplete Dominance) يظهر فيها أثر الأليلين معاً بصفة وسطية جديدة."
    },
    {
      question: "تُعبر ظهور أزهار باللون الأبيض الموشح بالأحمر في نبات الكاميليا نتيجة اجتماع أليلي اللون الأحمر والأبيض معاً دون ظهور صفة وسطية عن نمط:",
      options: ["السيادة التامة", "السيادة غير التامة", "السيادة المشتركة", "الصفة المتنحية"],
      correct: 2,
      explanation: "إجابة صحيحة! السيادة المشتركة (Codominance) تعبر عن مساهمة كلا الأليلين معاً في ظهور الطراز الشكلي دون اختلاطهما بصفة وسطية."
    },
    {
      question: "التلقيح الخلطي هو انتقال حبوب اللقاح من متك زهرة إلى ميسم نفس الزهرة أو زهرة أخرى في النبتة ذاتها. (صواب / خطأ)",
      options: ["صواب", "خطأ"],
      correct: 1,
      explanation: "إجابة خاطئة! هذا التعريف ينطبق على 'التلقيح الذاتي'. أما التلقيح الخلطي فيكون بانتقال حبوب اللقاح لزهرة في نبتة أخرى من النوع نفسه."
    },
    {
      question: "في نمط السيادة التامة، عند إجراء تلقيح ذاتي لأفراد الجيل الأول غير متماثلة الأليلات (Rr)، تكون نسبة الطرز الشكلية في الجيل الثاني هي:",
      options: ["1 سائد : 1 متنحٍ", "3 سائد : 1 متنحٍ", "جميعها سائدة", "جميعها متنحية"],
      correct: 1,
      explanation: "إجابة صحيحة! ناتج التزاوج (Rr × Rr) يعطي طرزاً شكلية بنسبة (3 سائد : 1 متنحٍ)."
    },
    {
      question: "اهتم العالم جريجور مندل في بحوثه بـ ...... صفات رئيسية لنبات البازيلاء.",
      options: ["3 صفات", "5 صفات", "7 صفات", "9 صفات"],
      correct: 2,
      explanation: "إجابة صحيحة! ركز مندل في أبحاثه على 7 صفات ظاهرة ومحددة في نبات البازيلاء مثل طول الساق ولون البذور وشكلها."
    },
    {
      question: "إذا كان الطراز الجيني لنبات بازيلاء لصفة طول الساق هو (tt)، فإن طرازه الشكلي هو:",
      options: ["طويل الساق نقي", "طويل الساق غير نقي", "قصير الساق", "متوسط الطول"],
      correct: 2,
      explanation: "إجابة صحيحة! الطراز الجيني المتماثل الأليلات المتنحي (tt) يُعبر عن الطراز الشكلي قصير الساق."
    },
    {
      question: "يُرمز عادةً للأليلات السائدة بحروف كبيرة (Upper-case) بينما يُرمز للأليلات المتنحية بحروف صغيرة (Lower-case). (صواب / خطأ)",
      options: ["صواب", "خطأ"],
      correct: 0,
      explanation: "إجابة صحيحة! تُستخدم الحروف الكبيرة مثل (T) للأليل السائد والحروف الصغيرة مثل (t) للأليل المتنحي."
    },
    {
      question: "عند تلقيح نباتي بازيلاء أرجوانيي الأزهار كلاهما نقي السلالة (RR × RR)، فإن النسبة المئوية المتوقعة لظهور الأزهار الأرجوانية في الأبناء هي:",
      options: ["25%", "50%", "75%", "100%"],
      correct: 3,
      explanation: "إجابة صحيحة! تزاوج أفراد نقية الصفة السائدة (RR × RR) يُنتج أبناء جميعهم (RR) بنسبة 100% أرجوانية الأزهار."
    },
    {
      question: "في نمط السيادة غير التامة عند إجراء تلقيح بين زهرتي فم السمكة كلاهما وردية الأزهار (RW × RW)، تكون نسبة الطرز الشكلية في الأبناء:",
      options: ["1 أحمر : 2 وردي : 1 أبيض", "3 أحمر : 1 أبيض", "جميعها وردية", "1 أحمر : 1 أبيض"],
      correct: 0,
      explanation: "إجابة صحيحة! التزاوج (RW × RW) ينتج (1RR أحمر : 2RW وردي : 1WW أبيض)."
    },
    {
      question: "إنتاج سلالة نقية لصفة ما يتطلب إجراء عملية تلقيح ذاتي مكرر لأجيال عدة متتابعة. (صواب / خطأ)",
      options: ["صواب", "خطأ"],
      correct: 0,
      explanation: "إجابة صحيحة! بدأ مندل تجاربه بتكرار التلقيح الذاتي لضمان الحصول على أفراد نقية السلالة للصفة المدروسة."
    },
    {
      question: "يرث الكائن الحي العاملين الوراثيين (الجينين) المسؤولين عن ظهور الصفة الوراثية الواحدة من:",
      options: ["كلاهما من الأب فقط", "كلاهما من الأم فقط", "أحدهما من الأب والآخر من الأم", "من البيئة المحيطة فقط"],
      correct: 2,
      explanation: "إجابة صحيحة! يتحكم في كل صفة جينان، يرث الفرد أحدهما من الأب عبر الجاميت الذكري والآخر من الأم عبر الجاميت الأنثوي."
    }
  ];

  let currentQuestion = 0;
  let score = 0;
  let timerInterval;
  const QUESTION_TIME = 30;
  let timeLeft = QUESTION_TIME;

  function startTimer() {
    timeLeft = QUESTION_TIME;
    document.getElementById("timer-text").innerText = timeLeft;
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById("timer-text").innerText = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, 1000);
  }

  function handleTimeout() {
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".option-btn");
    const feedback = document.getElementById("feedback-box");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correct) {
        btn.classList.add("correct");
      }
    });

    feedback.innerText = `⏰ انتهى الوقت! ${q.explanation}`;
    feedback.className = "feedback-box visible incorrect-fb";
    document.getElementById("next-btn").style.display = "inline-block";
  }

  function loadQuestion() {
    const q = questions[currentQuestion];
    
    document.getElementById("question-meta").innerText = `السؤال ${currentQuestion + 1} من ${questions.length}`;
    const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
    document.getElementById("progress-fill").style.width = `${progressPercent}%`;

    document.getElementById("question-text").innerText = q.question;
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    const feedback = document.getElementById("feedback-box");
    feedback.className = "feedback-box";
    feedback.innerText = "";
    document.getElementById("next-btn").style.display = "none";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      optionsContainer.appendChild(btn);
    });

    startTimer();
  }

  function selectOption(selectedIdx) {
    clearInterval(timerInterval);
    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".option-btn");
    const feedback = document.getElementById("feedback-box");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correct) {
        btn.classList.add("correct");
      }
      if (idx === selectedIdx && idx !== q.correct) {
        btn.classList.add("incorrect");
      }
    });

    if (selectedIdx === q.correct) {
      score++;
      feedback.innerText = q.explanation;
      feedback.className = "feedback-box visible correct-fb";
    } else {
      feedback.innerText = `إجابة خاطئة. ${q.explanation}`;
      feedback.className = "feedback-box visible incorrect-fb";
    }

    document.getElementById("next-btn").style.display = "inline-block";
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    clearInterval(timerInterval);
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = `${score} / ${questions.length}`;
  }

  function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("result-screen").style.display = "none";
    loadQuestion();
  }

  loadQuestion();
</script>

</body>
</html>
